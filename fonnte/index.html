<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirim WhatsApp</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        h2 { text-align: center; color: #128C7E; margin-top: 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: #25D366; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #128C7E; }
        #status { margin-top: 15px; padding: 10px; border-radius: 4px; text-align: center; display: none; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Kirim WhatsApp</h2>
        <form id="form">
            <label>Nomor (contoh: 081234567890)</label>
            <input type="tel" id="phone" required>
            
            <label>Pesan</label>
            <textarea id="msg" rows="4" required></textarea>
            
            <button type="submit">Kirim Sekarang</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        document.getElementById('form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('phone').value;
            const msg = document.getElementById('msg').value;
            const status = document.getElementById('status');
            
            fetch('https://api.fonnte.com/api/send', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'TOKEN_ANDA_DI_SINI'
                },
                body: JSON.stringify({
                    target: phone,
                    message: msg
                })
            })
            .then(res => res.json())
            .then(data => {
                status.style.display = 'block';
                if (data.status) {
                    status.className = 'success';
                    status.textContent = 'Pesan terkirim!';
                } else {
                    status.className = 'error';
                    status.textContent = 'Gagal: ' + (data.reason || 'Coba lagi');
                }
            })
            .catch(err => {
                status.style.display = 'block';
                status.className = 'error';
                status.textContent = 'Error: ' + err.message;
            });
        });
    </script>
</body>
</html>
