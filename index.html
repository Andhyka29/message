<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Kirim WhatsApp via Fonnte</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, textarea, button { width: 100%; padding: 10px; box-sizing: border-box; }
        button { background: #25D366; color: white; border: none; cursor: pointer; }
        button:hover { background: #128C7E; }
        .message { margin-top: 15px; padding: 10px; display: none; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h2>Kirim WhatsApp</h2>
    <form id="waForm">
        <div class="form-group">
            <label for="target">Nomor Tujuan (tanpa +62):</label>
            <input type="text" id="target" name="target" placeholder="081234567890" required>
        </div>
        <div class="form-group">
            <label for="message">Pesan:</label>
            <textarea id="message" name="message" rows="4" placeholder="Isi pesan..." required></textarea>
        </div>
        <button type="submit">Kirim</button>
    </form>
    <div id="result" class="message"></div>

    <script>
        const form = document.getElementById('waForm');
        const result = document.getElementById('result');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const target = document.getElementById('target').value.trim();
            const message = document.getElementById('message').value.trim();

            const payload = {
                target: target,
                message: message,
                countryCode: '62'
            };

            try {
                const response = await fetch('https://api.fonnte.com/api/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'YOUR_API_TOKEN_HERE'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (response.ok) {
                    result.className = 'message success';
                    result.textContent = 'Pesan berhasil dikirim!';
                } else {
                    result.className = 'message error';
                    result.textContent = 'Gagal: ' + (data.message || 'Error tidak diketahui');
                }
            } catch (error) {
                result.className = 'message error';
                result.textContent = 'Error: ' + error.message;
            }
            
            result.style.display = 'block';
        });
    </script>
</body>
</html>
